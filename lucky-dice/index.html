<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LUCKY DICE 666</title>
<meta name="description" content="3D 주사위 3개를 굴려 6·6·6 을 맞추면 카지노 잭팟이 터지는 럭키 다이스 게임">
<link rel="icon" href="assets/img/coin.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
:root{
  --ink:#0b0410; --plum:#1c0a24; --gold:#ffc83a; --gold-hi:#fff1a8; --gold-lo:#b8730a;
  --red:#ff2b3d; --red-lo:#8f0718; --pink:#ff3fa4; --felt:#0d5a2c; --text:#f7ecd2; --mute:#b9a488;
  --display:'Bungee','Pretendard',system-ui,sans-serif; --body:'Pretendard',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:-4%;background:url(assets/img/bg.jpg) center/cover;filter:saturate(1.1) brightness(.62);
  transition:filter .5s}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 20%,rgba(8,2,12,.82) 85%)}
body.jackpot #bg{filter:saturate(1.6) brightness(1.05);animation:bgpulse .42s steps(2) infinite}
@keyframes bgpulse{50%{filter:saturate(2) brightness(1.35) hue-rotate(25deg)}}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
body.shake #stage{animation:shake .09s linear infinite}
@keyframes shake{0%{transform:translate(7px,-5px) rotate(.4deg)}25%{transform:translate(-8px,4px) rotate(-.5deg)}
  50%{transform:translate(5px,7px) rotate(.3deg)}75%{transform:translate(-6px,-6px) rotate(-.3deg)}100%{transform:translate(4px,3px)}}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;justify-content:flex-end;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.hud>*{pointer-events:auto}
.plate{background:linear-gradient(180deg,rgba(40,14,48,.88),rgba(14,5,20,.9));border:1px solid rgba(255,200,58,.45);
  border-radius:14px;padding:8px 14px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,241,168,.18)}
.plate small{display:block;font-size:10px;letter-spacing:.18em;color:var(--mute);font-weight:700}
.plate b{font-family:var(--display);font-size:22px;font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,200,58,.55);display:flex;align-items:center;gap:6px}
.plate b::before{content:"";width:18px;height:18px;background:url(assets/img/coin.png) center/contain no-repeat;flex:none}
#logo{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:clamp(34px,7vh,64px);z-index:4;
  filter:drop-shadow(0 0 14px rgba(255,63,164,.55));pointer-events:none}
.tools{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,200,58,.45);background:rgba(20,7,26,.85);color:var(--gold);
  font:700 17px var(--body);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:rgba(60,20,70,.9)}
.icon-btn:focus-visible,.roll:focus-visible,.collect:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none}
.dock>*{pointer-events:auto}
.roll{font-family:var(--display);font-size:clamp(24px,4.4vh,34px);letter-spacing:.06em;color:#fff7dc;cursor:pointer;
  padding:14px 54px 16px;border-radius:99px;border:3px solid var(--gold);
  background:radial-gradient(ellipse at 50% 0,#ff7c86 0,var(--red) 38%,var(--red-lo) 100%);
  box-shadow:0 7px 0 #5c0410,0 14px 30px rgba(255,43,61,.45),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.45);
  text-shadow:0 2px 0 #5c0410;transition:transform .08s,box-shadow .08s,filter .2s}
.roll small{display:block;font:700 11px var(--body);letter-spacing:.16em;opacity:.85;text-shadow:none;margin-top:1px}
.roll:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 #5c0410,0 4px 12px rgba(255,43,61,.4),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.45)}
.roll:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
.roll.hot{animation:hot .5s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 7px 0 #5c0410,0 0 46px 10px rgba(255,120,40,.95),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.45)}}

#toast{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.6);z-index:6;opacity:0;pointer-events:none;text-align:center;
  font-family:var(--display);white-space:nowrap}
#toast.show{animation:toast 1.9s cubic-bezier(.2,1.4,.3,1) forwards}
#toast .t1{font-size:clamp(30px,7vw,64px);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a2c00) drop-shadow(0 0 18px rgba(255,200,58,.7))}
#toast .t2{font-size:clamp(16px,3vw,26px);color:#fff;text-shadow:0 2px 8px #000}
#toast.miss .t2{color:var(--mute)}
#toast.miss .t1{font-size:clamp(20px,4vw,34px);background:none;color:var(--mute);filter:drop-shadow(0 2px 4px #000)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

#pay{position:fixed;right:16px;top:calc(66px + env(safe-area-inset-top));z-index:7;width:250px;display:none}
#pay.open{display:block}
#pay table{width:100%;border-collapse:collapse;font-size:13px}
#pay td{padding:5px 2px;border-bottom:1px solid rgba(255,200,58,.14)}
#pay td:last-child{text-align:right;font-family:var(--display);color:var(--gold)}
#pay tr:first-child td{color:var(--red);font-weight:800}
#pay p{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.5}

body.jackpot .dock,body.jackpot #logo{opacity:0;transition:opacity .3s}
/* ---------- start ---------- */
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(60,14,60,.72),rgba(6,2,10,.96));
  cursor:pointer;transition:opacity .5s}
#start.gone{opacity:0;pointer-events:none}
#start .in{text-align:center;padding:24px}
#start img{width:min(86vw,640px);filter:drop-shadow(0 0 30px rgba(255,63,164,.6));animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) scale(1.02)}}
#start h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,3.4vw,28px);color:var(--gold);margin-top:26px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#start p{margin-top:14px;color:var(--mute);font-size:14px;line-height:1.7}
#start p b{color:var(--red)}

/* ---------- JACKPOT ---------- */
#jp{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;overflow:hidden}
#jp.on{display:block}
.jp-flash{position:absolute;inset:0;background:#fff;opacity:0}
#jp.on .jp-flash{animation:flash 1.5s linear forwards}
@keyframes flash{0%{opacity:1}8%{opacity:.15}12%{opacity:.95;background:#ffe27a}22%{opacity:.1}27%{opacity:.8;background:#ff5a6a}40%{opacity:.05}46%{opacity:.5;background:#fff}100%{opacity:0}}
.jp-rays{position:absolute;left:50%;top:26%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;mix-blend-mode:screen;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,58,.9) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 46%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 46%);
  animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jp-frame{position:absolute;inset:0;animation:frame .3s steps(1) infinite}
@keyframes frame{0%{box-shadow:inset 0 0 90px 26px rgba(255,200,58,.85)}33%{box-shadow:inset 0 0 110px 34px rgba(255,43,61,.85)}66%{box-shadow:inset 0 0 90px 26px rgba(255,63,164,.85)}}
.jp-banner{position:absolute;left:50%;top:25%;width:min(92vw,64vh,760px);transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 40px rgba(255,140,20,.9))}
#jp.on .jp-banner{animation:slam .8s cubic-bezier(.2,1.5,.35,1) both,throb .46s ease-in-out .8s infinite}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(7) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes throb{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-1.6deg)}50%{transform:translate(-50%,-50%) scale(1.09) rotate(1.6deg)}}
.jp-win{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;font-family:var(--display);opacity:0}
#jp.on .jp-win{animation:rise .6s 1.1s cubic-bezier(.2,1.5,.35,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.5)}to{opacity:1;transform:none}}
.jp-win small{display:block;font-size:clamp(14px,2.4vw,22px);color:#fff;letter-spacing:.3em;text-shadow:0 0 12px var(--pink)}
.jp-win b{font-weight:400;font-size:clamp(40px,min(11vw,12vh),110px);line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 0,var(--gold-hi) 25%,var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6b3300) drop-shadow(0 0 30px rgba(255,200,58,.95));display:inline-block;animation:throb2 .3s ease-in-out infinite}
@keyframes throb2{50%{transform:scale(1.05)}}
.collect{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(0);pointer-events:auto;cursor:pointer;
  font-family:var(--display);font-size:24px;color:#3a1c00;padding:12px 44px;border-radius:99px;border:3px solid #fff7dc;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));box-shadow:0 6px 0 #6b3300,0 0 40px rgba(255,200,58,.9)}
#jp.ready .collect{animation:pop .5s cubic-bezier(.2,1.6,.35,1) forwards}
@keyframes pop{to{transform:translateX(-50%) scale(1)}}
.jp-coins i{position:absolute;top:-90px;width:var(--s);height:var(--s);left:var(--x);background:url(assets/img/coin.png) center/contain no-repeat;
  animation:fall var(--d) linear var(--dl) infinite;filter:drop-shadow(0 0 8px rgba(255,200,58,.7))}
@keyframes fall{0%{transform:translateY(0) rotateY(0) rotate(0)}100%{transform:translateY(calc(100vh + 180px)) rotateY(1440deg) rotate(var(--r))}}
.jp-ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:8px solid #fff3b0;opacity:0}
#jp.on .jp-ring{animation:ring 1s ease-out forwards}
#jp.on .jp-ring.r2{animation-delay:.18s;border-color:#ff5a6a}
#jp.on .jp-ring.r3{animation-delay:.36s;border-color:#ff3fa4}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(140);border-width:1px}}

@media (max-width:640px){
  #logo{height:38px;left:16px;transform:none}
  #pay{right:10px;top:calc(62px + env(safe-area-inset-top))}
}
@media (prefers-reduced-motion:reduce){
  body.shake #stage,body.jackpot #bg,.jp-frame{animation:none}
  #jp.on .jp-flash{animation:none;opacity:0}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<img id="logo" src="assets/img/logo.webp" alt="LUCKY DICE">

<div class="hud">
  <div class="tools">
    <button class="icon-btn" id="btnPay" aria-label="배당표" title="배당표">?</button>
    <button class="icon-btn" id="btnMute" aria-label="소리 켜기/끄기" title="소리">♪</button>
  </div>
</div>

<div class="plate" id="pay">
  <table>
    <tr><td>6 · 6 · 6 &nbsp;JACKPOT</td><td>4,500</td></tr>
    <tr><td>트리플 (같은 숫자 3개)</td><td>2,500</td></tr>
    <tr><td>스트레이트 (연속된 숫자)</td><td>1,500</td></tr>
    <tr><td>페어 (같은 눈 2개)</td><td>200</td></tr>
    <tr><td>나머지</td><td>꽝</td></tr>
  </table>
  <p>매 굴림은 독립시행이라 6·6·6 확률은 언제나 1/216 입니다.</p>
</div>

<div id="toast"><div class="t1"></div><div class="t2"></div></div>

<div class="dock">
  <button class="roll" id="btnRoll" disabled>ROLL<small>SPACE · TAP</small></button>
</div>

<div id="jp" aria-live="assertive">
  <div class="jp-rays"></div>
  <div class="jp-frame"></div>
  <div class="jp-ring"></div><div class="jp-ring r2"></div><div class="jp-ring r3"></div>

  <img class="jp-banner" src="assets/img/jackpot.webp" alt="JACKPOT 666">

  <button class="collect" id="btnCollect">COLLECT</button>
  <div class="jp-flash"></div>
</div>

<div id="start"><div class="in">
  <img src="assets/img/logo.webp" alt="LUCKY DICE">
  <h2 id="startMsg">LOADING…</h2>
  <p>주사위 3개를 굴려 <b>6 · 6 · 6</b> 을 맞추면 잭팟!<br>소리를 켜고 즐기세요 🔊</p>
</div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from './vendor/cannon-es.js';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('luckydice.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('luckydice.' + k, JSON.stringify(v)); } catch {} },
};

/* ================= game state ================= */
const state = {
  busy: true, forceNext: new URLSearchParams(location.search).get('force') === '666',
  jackpot: null,
};

/* ================= audio ================= */
const SOUNDS = ['roll', 'hit', 'win_small', 'win_big', 'lose', 'boom', 'siren', 'coins', 'fireworks', 'crowd', 'fanfare', 'ambience', 'announcer'];
const audio = {
  ctx: null, master: null, buf: {}, muted: store.get('muted', false),
  async init() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1;
    this.master.connect(this.ctx.destination);
    await Promise.all(SOUNDS.map(async n => {
      try {
        const ab = await (await fetch(`assets/snd/${n}.mp3`)).arrayBuffer();
        this.buf[n] = await this.ctx.decodeAudioData(ab);
      } catch (e) { console.warn('sound missing', n, e); }
    }));
  },
  play(name, { vol = 1, rate = 1, loop = false, delay = 0 } = {}) {
    const b = this.buf[name]; if (!b || !this.ctx) return null;
    const src = this.ctx.createBufferSource(); src.buffer = b; src.loop = loop; src.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = vol; src.connect(g).connect(this.master);
    src.start(this.ctx.currentTime + delay);
    return { src, g };
  },
  stop(h, fade = .6) {
    if (!h) return; const t = this.ctx.currentTime;
    h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(h.g.gain.value, t); h.g.gain.linearRampToValueAtTime(0, t + fade);
    try { h.src.stop(t + fade + .05); } catch {}
  },
  fade(h, to, time = .6) {
    if (!h) return; const t = this.ctx.currentTime;
    h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(h.g.gain.value, t); h.g.gain.linearRampToValueAtTime(to, t + time);
  },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 1; $('btnMute').textContent = m ? '×' : '♪'; },
};
let ambience = null;

/* ================= three scene ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const PORTRAIT = innerHeight > innerWidth * 1.1;
const TW = PORTRAIT ? 7.6 : 12, TD = PORTRAIT ? 10.4 : 8;   // table inner size (x, z)
const DIE = 1.1, HALF = DIE / 2;
const LOOK = new THREE.Vector3(0, 0.4, 0.2);
const CAM_DIR = new THREE.Vector3(0, 1, 0.66).normalize();
let camDist = 18;

const texLoader = new THREE.TextureLoader();
const loadTex = (url, srgb = true) => new Promise(res => texLoader.load(url, t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }, undefined, () => res(null)));

/* lights */
scene.add(new THREE.AmbientLight(0xffe8d0, 0.35));
const spot = new THREE.SpotLight(0xfff0d8, 330, 60, 0.62, 0.55, 1.6);
spot.position.set(3.5, 15, 6); spot.target.position.set(0, 0, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0004; spot.shadow.radius = 5;
scene.add(spot, spot.target);
const partyA = new THREE.PointLight(0xff2b3d, 0, 40, 1.5), partyB = new THREE.PointLight(0xffc83a, 0, 40, 1.5);
scene.add(partyA, partyB);

/* table */
const table = new THREE.Group(); scene.add(table);
const feltMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 });
const felt = new THREE.Mesh(new THREE.PlaneGeometry(TW, TD), feltMat);
felt.rotation.x = -Math.PI / 2; felt.receiveShadow = true; table.add(felt);
const RIM = 0.7, RIM_H = 0.75;
const woodMat = new THREE.MeshPhysicalMaterial({ color: 0x3a0a10, roughness: 0.32, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.15 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xffc64a, roughness: 0.22, metalness: 1 });
function rimBox(w, d, x, z) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, RIM_H, d, 3, 0.16), woodMat);
  m.position.set(x, RIM_H / 2 - 0.12, z); m.castShadow = m.receiveShadow = true; table.add(m);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(w - 0.1, 0.05, d - 0.1), goldMat);
  trim.position.set(x, 0.02, z); table.add(trim);
}
rimBox(TW + RIM * 2, RIM, 0, -(TD + RIM) / 2); rimBox(TW + RIM * 2, RIM, 0, (TD + RIM) / 2);
rimBox(RIM, TD, -(TW + RIM) / 2, 0); rimBox(RIM, TD, (TW + RIM) / 2, 0);
const base = new THREE.Mesh(new THREE.BoxGeometry(TW + RIM * 2 - 0.2, 0.5, TD + RIM * 2 - 0.2), new THREE.MeshStandardMaterial({ color: 0x12050a, roughness: .8 }));
base.position.y = -0.3; table.add(base);

/* marquee bulbs on the rim */
const bulbPos = [];
{
  const ox = TW / 2 + RIM / 2, oz = TD / 2 + RIM / 2, step = 0.62;
  const nx = Math.round(ox * 2 / step), nz = Math.round(oz * 2 / step);
  for (let i = 0; i < nx; i++) bulbPos.push([-ox + (i / nx) * ox * 2, -oz]);
  for (let i = 0; i < nz; i++) bulbPos.push([ox, -oz + (i / nz) * oz * 2]);
  for (let i = 0; i < nx; i++) bulbPos.push([ox - (i / nx) * ox * 2, oz]);
  for (let i = 0; i < nz; i++) bulbPos.push([-ox, oz - (i / nz) * oz * 2]);

  jp.sounds.push(audio.play('siren', { vol: .75, delay: .25, loop: true }));
  jp.sounds.push(audio.play('fanfare', { vol: .8, delay: .5, loop: true }));
  jp.sounds.push(audio.play('coins', { vol: .7, delay: .4, loop: true }));
  jp.sounds.push(audio.play('fireworks', { vol: .8, delay: .5, loop: true }));
  jp.sounds.push(audio.play('crowd', { vol: .85, delay: .6, loop: true }));
  audio.play('announcer', { vol: 1.2, delay: 1.3 });
  audio.play('win_big', { vol: .9, delay: .15 });
  // ---- DOM overlay ----
  document.body.classList.add('jackpot'); if (!REDUCED) document.body.classList.add('shake');
  jp.timers.push(setTimeout(() => document.body.classList.remove('shake'), 1700));
  const el = $('jp'); el.classList.remove('ready'); el.classList.add('on');
  const cc = $('jpCoins'); cc.innerHTML = '';
  for (let i = 0; i < 46; i++) {
    const c = document.createElement('i');
    c.style.cssText = `--x:${rand(-4, 100)}vw;--s:${rand(26, 78) | 0}px;--d:${rand(1.1, 2.6).toFixed(2)}s;--dl:${rand(0, 2.4).toFixed(2)}s;--r:${rand(-360, 360) | 0}deg`;
    cc.appendChild(c);
  }
  const wEl = $('jpWin'), t0 = performance.now();
  (function tick(n) { if (!state.jackpot) return; const k = clamp((n - t0 - 1100) / 5200, 0, 1);
    wEl.textContent = Math.round(win * (1 - Math.pow(1 - k, 3))).toLocaleString(); if (k < 1) requestAnimationFrame(tick); })(t0);
  jp.timers.push(setTimeout(() => { el.classList.add('ready'); $('btnCollect').focus({ preventScroll: true }); }, 3800));
  // ---- 3D ----
  burst(_p.copy(center).setY(1), 0xffc83a, 420, 13, 1.6); burst(_p, 0xffffff, 200, 7, 1.1);
  spawnCoins(220, center, 1.15);
  confMesh.visible = true; beams.forEach(b => b.m.visible = true);
  $('btnRoll').disabled = true;
}
function collect() {
  const jp = state.jackpot; if (!jp || jp.collected) return; jp.collected = true;
  jp.sounds.forEach(h => audio.stop(h, 1.1)); jp.timers.forEach(clearTimeout);
  audio.play('win_small', { vol: .7 }); audio.fade(ambience, .16, 1.5);
  $('jp').classList.remove('on', 'ready'); document.body.classList.remove('jackpot', 'shake');
  jp.endAt = performance.now() / 1000;
}
function updateJackpot(now, dt) {
  const jp = state.jackpot; if (!jp) return;
  const t = now - jp.t0;
  if (jp.collected) { // wind down: dice drop back onto the felt
    const k = clamp((now - jp.endAt) / 0.7, 0, 1), e = ease(k);
    dice.forEach((d, i) => {
      d.mesh.position.lerpVectors(jp.hold[i].p, jp.from[i].p, e); d.mesh.quaternion.slerpQuaternions(jp.hold[i].q, jp.from[i].q, e);
      d.mesh.scale.setScalar(lerp(jp.hold[i].s, 1, e));
    });
    diceMats.forEach(m => m.emissiveIntensity = (1 - k) * 1.5);
    partyA.intensity = partyB.intensity = 0; beams.forEach(b => { b.m.material.opacity = 0; b.m.visible = false; });
    scene.environmentIntensity = 0.4; spot.intensity = 330;
    if (k >= 1) { state.jackpot = null; state.busy = false; $('btnRoll').disabled = false; }
    return;
  }
  // dice levitate, face 6 toward the camera and spin
  const lift = ease(clamp((t - 0.15) / 1.1, 0, 1));
  jp.hold = jp.hold || dice.map(() => ({ p: new THREE.Vector3(), q: new THREE.Quaternion(), s: 1 }));
  // hover point is anchored to the screen (just below the banner) so the dice are never hidden behind it
  const gap = PORTRAIT ? 1.5 : 1.9, hd = camDist * 0.6;
  _right.setFromMatrixColumn(camera.matrixWorld, 0); _up.setFromMatrixColumn(camera.matrixWorld, 1);
  _dir.set(0, -0.2, 0.5).unproject(camera).sub(camera.position).normalize();
  dice.forEach((d, i) => {
    const hp = _p.copy(camera.position).addScaledVector(_dir, hd).addScaledVector(_right, (i - 1) * gap).addScaledVector(_up, Math.sin(t * 3 + i * 1.3) * 0.16);
    d.mesh.position.lerpVectors(jp.from[i].p, hp, lift);
    const toCam = _v.copy(camera.position).sub(hp).normalize();
    const face = _q.setFromUnitVectors(AXIS6, toCam);
    const spin = new THREE.Quaternion().setFromAxisAngle(toCam, t * 2.4 * (i === 1 ? -1 : 1));
    d.mesh.quaternion.slerpQuaternions(jp.from[i].q, spin.multiply(face), lift);
    const s = lerp(1, 1.05 + Math.sin(t * 11 + i) * 0.06, lift); d.mesh.scale.setScalar(s);
    jp.hold[i].p.copy(d.mesh.position); jp.hold[i].q.copy(d.mesh.quaternion); jp.hold[i].s = s;
  });
  diceMats.forEach(m => m.emissiveIntensity = 1.2 + Math.sin(t * 16) * 0.9);
  // fireworks + coins
  jp.nextFw -= dt;
  if (jp.nextFw <= 0) { firework(); if (t < 9) firework(); jp.nextFw = t < 9 ? rand(.09, .26) : rand(.3, .6); }
  jp.coinAcc += dt * (t < 7 ? 150 : 55);
  while (jp.coinAcc >= 1) { jp.coinAcc--; if (Math.random() < .6) spawnCoins(1, jp.center, 1.1); else rainCoin(); }
  // lights
  const strobe = REDUCED ? 1 : (Math.sin(t * 26) > 0 ? 1 : .35);
  partyA.intensity = 260 * strobe; partyB.intensity = 260 * (REDUCED ? 1 : 1.35 - strobe);
  partyA.color.setHSL((t * .7) % 1, 1, .55); partyB.color.setHSL((t * .7 + .45) % 1, 1, .55);
  partyA.position.set(Math.cos(t * 2.3) * 6, 4.5, Math.sin(t * 2.3) * 5); partyB.position.set(Math.cos(t * 2.3 + 3.14) * 6, 4.5, Math.sin(t * 2.3 + 3.14) * 5);
  spot.intensity = 330 + 300 * Math.sin(t * 9) ** 2; scene.environmentIntensity = 0.9;
  const bo = clamp(t / .6, 0, 1) * 0.16;
  beams.forEach(b => { b.m.material.opacity = bo * (0.6 + 0.4 * Math.sin(t * 7 + b.ph)); b.m.rotation.z = -b.sx * (0.35 + 0.3 * Math.sin(t * 1.9 + b.ph)); b.m.rotation.x = b.sz * (0.3 + 0.3 * Math.cos(t * 1.5 + b.ph)); });
}

/* ================= camera ================= */
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  fwMat.uniforms.uSize.value = h * renderer.getPixelRatio() * 0.42;
  const hx = TW / 2 + RIM + .2, hz = TD / 2 + RIM + .2;
  const pts = [[-hx, RIM_H, -hz], [hx, RIM_H, -hz], [-hx, 0, hz], [hx, 0, hz]];
  const topLim = 1 - (2 * Math.min(120, h * .16)) / h, botLim = -1 + (2 * Math.min(190, h * .25)) / h;
  let lo = 6, hi = 80;
  for (let k = 0; k < 22; k++) {
    const d = (lo + hi) / 2; camera.position.copy(LOOK).addScaledVector(CAM_DIR, d); camera.lookAt(LOOK); camera.updateMatrixWorld();
    const ok = pts.every(p => { _v.set(...p).project(camera); return Math.abs(_v.x) < .95 && _v.y < topLim && _v.y > botLim; });
    if (ok) hi = d; else lo = d;
  }
  camDist = hi;
}
const _off = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function updateCamera(now) {
  let zoom = 1, yaw = Math.sin(now * .25) * 0.035, sh = 0, look = LOOK;
  const jp = state.jackpot;
  if (jp && !jp.collected) {
    const t = now - jp.t0;
    zoom = t < .45 ? lerp(1, .62, ease(t / .45)) : lerp(.62, 1.04, ease(clamp((t - .45) / 1.1, 0, 1)));
    zoom += Math.sin(t * 4.2) * 0.012; yaw = Math.sin(t * .9) * 0.2; sh = REDUCED ? 0 : Math.max(0, 1 - t / 2.2) * 0.4 + 0.035;
  }
  _off.copy(CAM_DIR).multiplyScalar(camDist * zoom).applyAxisAngle(UP, yaw);
  camera.position.copy(look).add(_off);
  if (sh) camera.position.add(_v.set(rand(-sh, sh), rand(-sh, sh), rand(-sh, sh)));
  camera.lookAt(look);
}

/* ================= loop ================= */
let last = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now;
  if (playback) updatePlayback(now);
  updateJackpot(now, dt);
  updateCoins(dt); updateFireworks(dt);
  updateConfetti(dt, now, !!state.jackpot && !state.jackpot.collected);
  updateBulbs(now); updateCamera(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function placeIdle() { // idle pose: teasing 6 · 6 · 6
  dice.forEach((d, i) => {
    d.mesh.position.set((i - 1) * 1.7, HALF, 0.4);
    d.mesh.quaternion.setFromAxisAngle(UP, rand(-.5, .5)).multiply(_q.setFromAxisAngle(_v.set(0, 0, 1), -Math.PI / 2));
  });
}
addEventListener('resize', fitCamera);
$('btnRoll').addEventListener('click', startRoll);
$('btnCollect').addEventListener('click', collect);
$('btnMute').addEventListener('click', () => audio.setMuted(!audio.muted));
$('btnPay').addEventListener('click', () => $('pay').classList.toggle('open'));
renderer.domElement.addEventListener('pointerdown', () => { if ($('pay').classList.contains('open')) $('pay').classList.remove('open'); else startRoll(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); if (state.jackpot) { if ($('jp').classList.contains('ready')) collect(); } else startRoll(); return; }
  if (e.key === 'm') audio.setMuted(!audio.muted);
});

(async function boot() {
  placeIdle(); fitCamera(); audio.setMuted(audio.muted);
  requestAnimationFrame(frame);
  const [feltTex, coinTex] = await Promise.all([loadTex('assets/img/felt.jpg'), loadTex('assets/img/coin.png')]);
  if (feltTex) { feltTex.wrapS = feltTex.wrapT = THREE.RepeatWrapping; feltTex.repeat.set(TW / 6, TD / 6); feltMat.map = feltTex; feltMat.needsUpdate = true; } else feltMat.color.set(0x0d5a2c);
  buildCoins(coinTex);
  $('startMsg').textContent = 'TAP TO PLAY';
  $('start').addEventListener('click', async () => {
    $('startMsg').textContent = 'LOADING…';
    try { await audio.init(); await audio.ctx.resume(); } catch (e) { console.warn(e); }
    ambience = audio.play('ambience', { vol: .16, loop: true });
    $('start').classList.add('gone'); state.busy = false; $('btnRoll').disabled = false;
  }, { once: true });
})();
window.__game = { state, startRoll, collect, simulate, force: () => { state.forceNext = true; } };
</script>
