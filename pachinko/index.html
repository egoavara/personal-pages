<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LUCKY PACHINKO</title>
<meta name="description" content="사람마다 공 개수를 정해 굴리는 3D 빠칭코 뽑기. 마지막까지 공이 남은 한 명이 당첨">
<link rel="icon" href="../lucky-dice/assets/img/coin.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script type="importmap">{"imports":{"three":"../lucky-dice/vendor/three.module.js"}}</script>
<style>
:root{
  --ink:#07030f; --panel:rgba(22,9,40,.9); --gold:#ffc83a; --gold-hi:#fff1a8; --gold-lo:#b8730a;
  --red:#ff2b4f; --pink:#ff3fa4; --cyan:#3fe0ff; --green:#39f08a; --text:#f4ecff; --mute:#a99cc4;
  --display:'Bungee','Pretendard',system-ui,sans-serif; --body:'Pretendard',system-ui,sans-serif;
  --side:250px; --bottom:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:-4%;background:url(assets/img/bg.jpg) center/cover;filter:brightness(.5) saturate(1.1)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 55% 50%,rgba(7,3,15,.35) 10%,rgba(7,3,15,.9) 85%)}
body.sudden #bg{animation:sud .5s steps(2) infinite}
@keyframes sud{50%{filter:brightness(.75) saturate(1.6) hue-rotate(-40deg)}}
body.win #bg{filter:brightness(1) saturate(1.5);animation:bgw .4s steps(2) infinite}
@keyframes bgw{50%{filter:brightness(1.3) saturate(1.9) hue-rotate(30deg)}}
#stage{position:fixed;top:0;right:0;left:var(--side);bottom:var(--bottom)}
#stage canvas{display:block;width:100%;height:100%}
body.shake #stage{animation:shake .09s linear infinite}
@keyframes shake{0%{transform:translate(6px,-4px)}25%{transform:translate(-7px,4px)}50%{transform:translate(4px,6px)}75%{transform:translate(-5px,-5px)}100%{transform:translate(3px,2px)}}

/* roster */
#roster{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:4;padding:14px 12px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(90deg,rgba(10,4,22,.92),rgba(10,4,22,.55) 80%,transparent)}
#roster img{width:100%;filter:drop-shadow(0 0 12px rgba(255,63,164,.55))}
.clock{font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 0 14px rgba(255,200,58,.6);font-variant-numeric:tabular-nums;line-height:1}
.clock small{display:block;font:800 10px var(--body);letter-spacing:.2em;color:var(--mute);margin-bottom:4px}
#list{list-style:none;display:flex;flex-direction:column;gap:4px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;flex:1;min-height:0}
#list::-webkit-scrollbar{display:none}
#list li{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-weight:700;font-size:14px;transition:opacity .4s,background .3s}
#list i{width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
#list span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
#list li.hit{background:rgba(255,43,79,.5)}
#list li.gone{opacity:.32}#list li.gone span{text-decoration:line-through}#list li.gone b{color:var(--mute);font:700 11px var(--body)}
#list li.winner{background:linear-gradient(90deg,rgba(255,200,58,.5),rgba(255,63,164,.35));border-color:var(--gold);box-shadow:0 0 18px rgba(255,200,58,.6)}
.tools{display:flex;gap:8px}
.icon-btn{height:38px;min-width:38px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,200,58,.45);background:rgba(20,7,36,.85);color:var(--gold);font:700 13px var(--body);cursor:pointer}
.icon-btn:hover{background:rgba(70,24,100,.9)}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

#toast{position:fixed;left:calc(50% + var(--side)/2);top:16%;transform:translate(-50%,-50%);z-index:6;opacity:0;pointer-events:none;text-align:center;font-family:var(--display);white-space:nowrap}
#toast.show{animation:toast 1.7s cubic-bezier(.2,1.4,.3,1) forwards}
#toast .t1{font-size:clamp(24px,5vw,52px);color:#fff;text-shadow:0 0 18px var(--tc,var(--red)),0 3px 0 #000}
#toast .t2{font:800 clamp(13px,2vw,18px) var(--body);color:var(--gold-hi);text-shadow:0 2px 6px #000;letter-spacing:.1em}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
#alarm{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0}
body.sudden #alarm{opacity:1;animation:alarm .5s steps(1) infinite}
@keyframes alarm{0%{box-shadow:inset 0 0 120px 30px rgba(255,43,79,.75)}50%{box-shadow:inset 0 0 60px 10px rgba(255,43,79,.3)}}

/* setup */
#setup{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(50,14,80,.78),rgba(5,2,12,.97));transition:opacity .4s;padding:16px;overflow:auto}
#setup.gone{opacity:0;pointer-events:none}
.card{width:min(700px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
.card>img{width:min(520px,100%);align-self:center;filter:drop-shadow(0 0 26px rgba(255,63,164,.6))}
.card p{color:var(--mute);font-size:13px;line-height:1.6;text-align:center}
.card p b{color:var(--gold)}
.rows{background:var(--panel);border:1px solid rgba(255,200,58,.35);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,200,58,.4) transparent}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05);min-width:0}
.row.zero{opacity:.4}
.row i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.row span{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row em{font:700 11px var(--body);color:var(--mute);font-style:normal;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,200,58,.4);background:rgba(0,0,0,.4);color:var(--gold);font:700 18px/1 var(--body);cursor:pointer}
.step button:active{background:var(--gold);color:#000}
.step input{font-family:var(--display);width:46px;height:30px;text-align:center;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:14px;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:focus{outline:2px solid var(--gold);outline-offset:1px}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.bar span{font-weight:700;color:var(--mute);font-size:13px}
.bar span b{color:var(--gold);font-family:var(--display);font-weight:400}
.go{font-family:var(--display);font-size:28px;color:#fff7dc;cursor:pointer;padding:13px 0 15px;border-radius:99px;border:3px solid var(--gold);width:100%;
  background:radial-gradient(ellipse at 50% 0,#ff8aa0 0,var(--red) 40%,#8a0724 100%);box-shadow:0 7px 0 #4e0414,0 14px 30px rgba(255,43,79,.45),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 #4e0414}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 #4e0414}
.go:disabled{filter:grayscale(.8) brightness(.6);cursor:default}

/* winner */
#win{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;overflow:hidden}
#win.on{display:block}
.w-flash{position:absolute;inset:0;background:#fff;opacity:0}
#win.on .w-flash{animation:flash 1.4s linear forwards}
@keyframes flash{0%{opacity:1}8%{opacity:.15}12%{opacity:.9;background:#ffe27a}22%{opacity:.1}27%{opacity:.75;background:#ff5aa0}40%{opacity:.05}100%{opacity:0}}
.w-rays{position:absolute;left:50%;top:30%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;mix-blend-mode:screen;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,58,.9) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 46%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 46%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.w-frame{position:absolute;inset:0;animation:frame .3s steps(1) infinite}
@keyframes frame{0%{box-shadow:inset 0 0 90px 26px rgba(255,200,58,.85)}33%{box-shadow:inset 0 0 110px 34px rgba(63,224,255,.8)}66%{box-shadow:inset 0 0 90px 26px rgba(255,63,164,.85)}}
.w-banner{position:absolute;left:50%;top:24%;width:min(90vw,70vh,760px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 36px rgba(255,160,40,.9))}
#win.on .w-banner{animation:slam .8s cubic-bezier(.2,1.5,.35,1) both,throb .46s ease-in-out .8s infinite}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(7) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes throb{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-1.4deg)}50%{transform:translate(-50%,-50%) scale(1.07) rotate(1.4deg)}}
.w-name{position:absolute;left:0;right:0;top:50%;text-align:center;opacity:0;font-weight:900;font-size:clamp(34px,min(11.5vw,16vh),150px);line-height:1;letter-spacing:.01em;
  color:#fff;-webkit-text-stroke:2px var(--wc,#ffc83a);text-shadow:0 0 30px var(--wc,#ffc83a),0 0 80px var(--wc,#ffc83a),0 8px 0 rgba(0,0,0,.6)}
#win.on .w-name{animation:rise .7s .9s cubic-bezier(.2,1.6,.35,1) forwards,throb2 .32s ease-in-out 1.6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(80px) scale(.3)}to{opacity:1;transform:none}}
@keyframes throb2{50%{transform:scale(1.05)}}
.w-sub{position:absolute;left:0;right:0;top:calc(50% + clamp(44px,min(13vw,18vh),170px));text-align:center;font:800 clamp(14px,2.4vw,22px) var(--body);letter-spacing:.3em;color:#fff;text-shadow:0 0 12px var(--pink);opacity:0}
#win.on .w-sub{animation:rise .5s 1.5s forwards}
.again{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(0);pointer-events:auto;cursor:pointer;
  font-family:var(--display);font-size:22px;color:#3a1c00;padding:12px 40px;border-radius:99px;border:3px solid #fff7dc;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));box-shadow:0 6px 0 #6b3300,0 0 40px rgba(255,200,58,.9)}
#win.ready .again{animation:pop .5s cubic-bezier(.2,1.6,.35,1) forwards}
@keyframes pop{to{transform:translateX(-50%) scale(1)}}

@media (max-width:820px){
  :root{--side:0px;--bottom:118px}
  #roster{top:auto;right:0;width:auto;height:var(--bottom);flex-direction:row;align-items:stretch;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:8px;
    background:linear-gradient(0deg,rgba(10,4,22,.95),rgba(10,4,22,.7))}
  #roster img{display:none}
  .head{display:flex;flex-direction:column;justify-content:space-between;flex:none}
  .clock{font-size:20px}
  #list{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px}
  #list li{padding:2px 6px;font-size:11px;gap:4px;border-radius:7px}
  #list i{width:8px;height:8px}#list b{font-size:11px}
  .rows{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  body.shake #stage,body.sudden #bg,body.win #bg,.w-frame,body.sudden #alarm{animation:none}
  #win.on .w-flash{animation:none;opacity:0}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<div id="alarm"></div>

<aside id="roster">
  <img src="assets/img/logo.webp" alt="LUCKY PACHINKO">
  <div class="head">
    <div class="clock"><small>TIME</small><span id="clock">00.0</span></div>
    <div class="tools"><button class="icon-btn" id="btnMute" aria-label="소리 켜기/끄기">♪</button></div>
  </div>
  <ul id="list"></ul>
</aside>

<div id="toast"><div class="t1"></div><div class="t2"></div></div>

<div id="win" aria-live="assertive">
  <div class="w-rays"></div><div class="w-frame"></div>
  <img class="w-banner" src="assets/img/winner.webp" alt="WINNER">
  <div class="w-name" id="winName"></div>
  <div class="w-sub">당첨을 축하합니다</div>
  <button class="again" id="btnAgain">다시 하기</button>
  <div class="w-flash"></div>
</div>

<div id="setup"><div class="card">
  <img src="assets/img/logo.webp" alt="LUCKY PACHINKO">
  <p>사람마다 공 개수를 정하고 굴리세요. OUT 칸에 빠진 공은 탈락,<br><b>마지막까지 공이 남은 한 명이 당첨</b>입니다. 한 판은 35초 이상, 공이 많으면 더 걸립니다.</p>
  <div class="rows" id="rows"></div>
  <div class="bar">
    <span>공 <b id="total">0</b>개 · 참가 <b id="players">0</b>명 · 약 <b id="eta">41</b>초</span>
    <div class="tools"><button class="icon-btn" id="allMinus10">−10</button><button class="icon-btn" id="allMinus">전체 −1</button><button class="icon-btn" id="allPlus">전체 +1</button><button class="icon-btn" id="allPlus10">+10</button></div>
  </div>
  <button class="go" id="btnGo" disabled>LOADING…</button>
</div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from '../lucky-dice/vendor/RoundedBoxGeometry.js';
import { RoomEnvironment } from '../lucky-dice/vendor/RoomEnvironment.js';
import { initPhysics, Game, DT, ACTIVE, LIFT, suddenTime, BOARD, PINS, BUMPERS, SPINNERS, WARPS, WARP_R, KICKERS, FLIPPERS, DIVIDERS } from './sim.js';

const PEOPLE = ['benjamin.butn', 'angus.bak', 'bayne.jeong', 'beans.go', 'frisk.gwak', 'hasey.chong2', 'isla.moon', 'jacob.nam', 'jaeky.rs', 'kane.woz', 'kenny.kim2', 'otto.yoon', 'rudy.yoon'];
const MAX_BALLS = 500, MIN_TIME = 35, TAG_LIMIT = 160;   // 남은 공이 TAG_LIMIT 개 이하일 때만 이름표를 붙인다
const R = 0.19, { W, H, SLOTS, SLOT_TOP } = BOARD, HW = W / 2, SLOT_W = W / SLOTS;

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('pachinko.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pachinko.' + k, JSON.stringify(v)); } catch {} },
};
const COLORS = PEOPLE.map((_, i) => new THREE.Color().setHSL((i * 0.618034 + 0.02) % 1, 1, 0.5));
const css = c => '#' + c.getHexString();

/* ================= audio ================= */
const SOUNDS = { tink: 0, bump: 0, flip: 0, warp: 0, out: 0, safe: 0, knockout: 0, start: 0, sudden: 0, stream: 0, bgm: 0, announcer: 0,
  boom: '../lucky-dice/assets/snd/boom.mp3', fanfare: '../lucky-dice/assets/snd/fanfare.mp3', crowd: '../lucky-dice/assets/snd/crowd.mp3', fireworks: '../lucky-dice/assets/snd/fireworks.mp3' };
const audio = {
  ctx: null, master: null, buf: {}, last: {}, muted: store.get('muted', false),
  async init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
    await Promise.all(Object.entries(SOUNDS).map(async ([n, url]) => {
      try { this.buf[n] = await this.ctx.decodeAudioData(await (await fetch(url || `assets/snd/${n}.mp3`)).arrayBuffer()); } catch (e) { console.warn('sound missing', n); }
    }));
  },
  play(name, { vol = 1, rate = 1, loop = false, delay = 0, gap = 0 } = {}) {
    const b = this.buf[name]; if (!b || !this.ctx) return null;
    const now = this.ctx.currentTime; if (gap && now - (this.last[name] || -9) < gap) return null; this.last[name] = now;
    const src = this.ctx.createBufferSource(); src.buffer = b; src.loop = loop; src.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = vol; src.connect(g).connect(this.master); src.start(now + delay);
    return { src, g };
  },
  stop(h, fade = .6) { if (!h) return; const t = this.ctx.currentTime; h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(h.g.gain.value, t); h.g.gain.linearRampToValueAtTime(0, t + fade); try { h.src.stop(t + fade + .05); } catch {} },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 1; $('btnMute').textContent = m ? '×' : '♪'; },
};

/* ================= scene ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.toneMapping = THREE.NoToneMapping;   // ACES 는 색을 빼서 화면이 뿌옇게 보인다
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.28;
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 300);
const LOOK = new THREE.Vector3(0, 8.15, 0), CAM_DIR = new THREE.Vector3(0, -0.2, 1).normalize();
let camDist = 40;
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-4, 12, 14); scene.add(key);
const glowA = new THREE.PointLight(0xff3fa4, 0, 30, 1.6), glowB = new THREE.PointLight(0x3fe0ff, 0, 30, 1.6);
glowA.position.set(-4, 13, 3); glowB.position.set(4, 4, 3); scene.add(glowA, glowB);

const texLoader = new THREE.TextureLoader();
const loadTex = url => new Promise(res => texLoader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); }, undefined, () => res(null)));
const gold = new THREE.MeshStandardMaterial({ color: 0xffc64a, roughness: 0.22, metalness: 1 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xe8ecff, roughness: 0.12, metalness: 1 });
const lacquer = new THREE.MeshPhysicalMaterial({ color: 0x1a0626, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1 });
const board = new THREE.Group(); scene.add(board);
const boardMat = new THREE.MeshBasicMaterial({ color: 0x241048 });
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(W + 1.9, H + 1.5), boardMat); m.position.set(0, H / 2 - 0.25, 0); board.add(m); }
function bar(w, h, x, y, mat = lacquer, d = 0.9) { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.14), mat); m.position.set(x, y, d / 2 - 0.1); board.add(m); return m; }
bar(W + 3.1, 0.6, 0, H + 0.75); bar(W + 3.1, 0.6, 0, -1.25); bar(0.6, H + 2.6, -HW - 1.25, H / 2 - 0.25); bar(0.6, H + 2.6, HW + 1.25, H / 2 - 0.25);
bar(0.1, H + 0.2, -HW - 0.05, H / 2 - 0.3, gold, 0.5); bar(0.1, H + 0.2, HW + 0.05, H / 2 - 0.3, gold, 0.5);
// lift tubes
{ const glass = new THREE.MeshPhysicalMaterial({ color: 0x9fe8ff, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0, depthWrite: false });
  for (const s of [-1, 1]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, H + 0.3, 16, 1, true), glass); t.position.set(s * BOARD.TUBE_X, H / 2 - 0.5, R); board.add(t); } }
// pins

    if (g.tick > 3) g.tick = 0;
    if (loops.stream) loops.stream.g.gain.value = Math.min(.42, sim.active / 60 * .42);
  }
  spinnerMeshes.forEach((m, i) => m.rotation.z = sim.spinAngle[i]);
  flipperMeshes.forEach((m, i) => m.rotation.z = sim.flipAngle[i]);
}
function updateFx(now, dt) {
  bumperMeshes.forEach(b => { b.flash = Math.max(0, b.flash - dt * 5); b.mat.emissiveIntensity = b.flash * 1.2; b.m.scale.setScalar(1 + b.flash * 0.12); });
  kickerMeshes.forEach(k => { k.flash = Math.max(0, k.flash - dt * 5); k.mat.emissiveIntensity = k.flash * 1.2; });
  warpMeshes.forEach((w, i) => { w.flash = Math.max(0, w.flash - dt * 3); w.eflash = Math.max(0, w.eflash - dt * 3);
    w.ring.scale.setScalar(1 + Math.sin(now * 5 + i) * 0.06 + w.flash * 0.5); w.mat.color.setHSL(0.52 + Math.sin(now * 2 + i) * 0.06, 1, 0.55 + w.flash * 0.4); w.exit.scale.setScalar(1 + w.eflash * 0.6); });
  slotMeshes.forEach(s => { s.flash = Math.max(0, s.flash - dt * 3.5); if (s.mat.map) { const k = 0.75 + 0.2 * Math.sin(now * 4) + s.flash * 1.6; s.mat.color.setScalar(k); } else s.mat.color.setScalar(0.25); });
  glowA.intensity = glowB.intensity = 0;   // 평소엔 꺼 둔다. 판 위에 색 안개가 끼어 흐려 보인다
  if (fin) {
    const t = now - fin.t0; fin.next -= dt;
    if (fin.next <= 0) { firework(); if (t < 8) firework(); fin.next = t < 8 ? rand(.1, .28) : rand(.35, .7); }
    glowA.color.setHSL((t * .7) % 1, 1, .55); glowB.color.setHSL((t * .7 + .45) % 1, 1, .55); glowA.intensity = glowB.intensity = REDUCED ? 60 : (Math.sin(t * 26) > 0 ? 110 : 30);
  } else { glowA.color.set(0xff3fa4); glowB.color.set(0x3fe0ff); }
}

/* ================= camera + loop ================= */
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  fwMat.uniforms.uSize.value = h * renderer.getPixelRatio() * 0.5;
  const pts = [[-HW - 1.6, -1.6, 0], [HW + 1.6, -1.6, 0], [-HW - 1.6, H + 1.1, 0.8], [HW + 1.6, H + 1.1, 0.8]];
  let lo = 8, hi = 160;
  for (let k = 0; k < 24; k++) {
    const d = (lo + hi) / 2; camera.position.copy(LOOK).addScaledVector(CAM_DIR, d); camera.lookAt(LOOK); camera.updateMatrixWorld();
    if (pts.every(p => { _v.set(...p).project(camera); return Math.abs(_v.x) < .97 && Math.abs(_v.y) < .97; })) hi = d; else lo = d;
  }
  camDist = hi;
}
let last = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now;
  if (game) updateGame(dt);
  updateFx(now, dt); updateFireworks(dt); updateConfetti(dt, now, !!fin);
  const sway = Math.sin(now * .3) * 0.02, sh = fin && !REDUCED ? Math.max(0, 1 - (now - fin.t0) / 1.8) * 0.3 : 0;
  camera.position.copy(LOOK).addScaledVector(_v.copy(CAM_DIR).applyAxisAngle(THREE.Object3D.DEFAULT_UP, sway), camDist);
  if (sh) camera.position.add(_v.set(rand(-sh, sh), rand(-sh, sh), 0));
  camera.lookAt(LOOK);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', fitCamera);
if (window.ResizeObserver) new ResizeObserver(fitCamera).observe(stage);   // 처음에 크기가 0 이었다가 나중에 잡히는 경우까지 챙긴다
$('btnGo').addEventListener('click', start);
$('btnAgain').addEventListener('click', again);
$('btnMute').addEventListener('click', () => audio.setMuted(!audio.muted));
(async function boot() {
  audio.setMuted(audio.muted); renderSetup(); fitCamera(); requestAnimationFrame(frame);
  const [boardTex] = await Promise.all([loadTex('assets/img/board.jpg'), initPhysics(), document.fonts ? document.fonts.load('400 34px Bungee').catch(() => {}) : 0, document.fonts ? document.fonts.load('800 36px Pretendard', 'a').catch(() => {}) : 0]);
  if (boardTex) { boardMat.map = boardTex; boardMat.color.set(0xffffff); boardMat.needsUpdate = true; }
  texSafe = slotTexture('SAFE', 'rgba(57,240,138,.95)', '#04240f'); texOut = slotTexture('OUT', 'rgba(255,43,79,.95)', '#2a0008');
  makeTags(); ready = true; renderSetup();
})();
window.__game = { start, again, skip(sec) { if (!game) return; const end = game.sim.t + sec; while (game && game.sim.t < end && !game.won) { game.sim.step(); for (const e of game.sim.events) handle(e); game.sim.events.length = 0; } return game.sim.t; }, get counts() { return counts; }, set counts(c) { counts = c; renderSetup(); } };
</script>
