// Place each time chip on its own line, keeping stops and nearby routes legible.
function placeLegChips(legs, stops){
 const project=ll=>streets.latLngToContainerPoint(ll);
 const paths=legs.map(leg=>L.LineUtil.simplify(leg.line.getLatLngs().map(project),1));
 const occupied=stops.map(ll=>{
  const {x,y}=project(ll);
  return [x-24,y-39,x+24,y+23];
 });
 const size=streets.getSize();
 const overlap=(a,b)=>Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*
                       Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
 paths.forEach((path,i)=>{
  const chip=legs[i].chip, element=chip.getElement();
  if(!element)return;
  const w=element.offsetWidth/2+3,h=element.offsetHeight/2+3;
  const lengths=path.slice(1).map((p,k)=>p.distanceTo(path[k]));
  const total=lengths.reduce((a,b)=>a+b,0);
  const start=path[0], end=path[path.length-1], span=end.subtract(start);
  const straightLength=start.distanceTo(end);
  let best,score=Infinity;
  for(let step=1;step<40;step++){
   const fraction=step/40;
   let remaining=total*fraction,k=0;
   while(k<lengths.length-1 && remaining>lengths[k])remaining-=lengths[k++];
   const a=path[k], vector=path[k+1].subtract(a);
   const point=a.add(vector.multiplyBy(remaining/(lengths[k]||1)));
   let routeCost=Math.abs(fraction-0.78)*25;
   paths.forEach((other,n)=>{
    if(n===i)return;
    let distance=Infinity;
    for(let m=1;m<other.length;m++)
     distance=Math.min(distance,L.LineUtil.pointToSegmentDistance(point,other[m-1],other[m]));
    routeCost+=Math.max(0,w-distance)*4;
   });
   // Short or retraced legs may have no room for a chip on the line.
   for(const [dx,dy] of [[0,0],[w+12,0],[-w-12,0],[0,h+32],[0,-h-32],
    [w+12,h+28],[-w-12,h+28],[w+12,-h-28],[-w-12,-h-28],[0,h+78],[0,-h-78]]){
    const x=point.x+dx,y=point.y+dy,rect=[x-w,y-h,x+w,y+h];
    const covered=occupied.reduce((sum,r)=>sum+overlap(rect,r),0);
    const clipped=Math.max(0,4*w*h-overlap(rect,[0,0,size.x,size.y]));
    const center=L.point(x,y);
    // Keep displaced labels alongside their leg instead of past the next stop.
    const along=((x-start.x)*span.x+(y-start.y)*span.y)/(straightLength||1);
    const overshoot=Math.max(0,-along,along-straightLength);
    let nearestOther=Infinity;
    paths.forEach((other,n)=>{
     if(n===i)return;
     for(let m=1;m<other.length;m++)
      nearestOther=Math.min(nearestOther,L.LineUtil.pointToSegmentDistance(center,other[m-1],other[m]));
    });
    const wrongLine=Math.max(0,Math.hypot(dx,dy)-nearestOther);
    const cost=overshoot*32+wrongLine*10+routeCost+Math.hypot(dx,dy)*4+covered*100+clipped*80;
    if(cost<score){score=cost;best={point,center:L.point(x,y),rect};}
   }
  }
  const anchor=streets.containerPointToLatLng(best.point);
  const center=streets.containerPointToLatLng(best.center);
  legs[i].leader.setLatLngs(best.center.equals(best.point)?[]:[anchor,center]);
  chip.setLatLng(center);
  occupied.push(best.rect);
 });
}
let refreshLegChips;
function routeLayer(stops,ids){
 const version=++drawVersion;
 const coord=id=>venues[id].slice(1,3);
 const box=ids.map(coord);
 if(!window.L){
  document.querySelector('#streetmap').textContent='온라인 지도를 불러올 수 없습니다. 아래 약도 또는 각 구간의 길찾기를 이용하세요.';
  return ()=>{};
 }
 if(!streets){
  streets=L.map('streetmap',{scrollWheelZoom:false}).setView(box[0],14);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:19,attribution:'Tiles © Esri · Source: Esri, HERE, Garmin, USGS, Intermap, increment P, NRCan, METI, TomTom, and GIS User Community'}).addTo(streets);
 }
 if(overlays)overlays.remove();
 overlays=L.layerGroup().addTo(streets);

 const legs=[];
 if(refreshLegChips)streets.off('moveend resize',refreshLegChips);
 let frame;
 refreshLegChips=()=>{
  cancelAnimationFrame(frame);
  frame=requestAnimationFrame(()=>{if(version===drawVersion)placeLegChips(legs,box);});
 };
 streets.on('moveend resize',refreshLegChips);
 for(let j=1;j<stops.length;j++){
  const from=stops[j-1][0],to=stops[j][0],duration=stops[j][2];
  const endpoints=[coord(from),coord(to)];
  const line=L.polyline(endpoints,{color:'#086558',weight:4,dashArray:'6 6'}).addTo(overlays);
  const flow=L.polyline(endpoints,{className:'route-flow',color:'#ffdf91',weight:4.5,opacity:1,lineCap:'round',dashArray:'0.1 63.9',interactive:false}).addTo(overlays);
  const timing=timingNotes[from+':'+to];
  const timingInfo=timing?'<strong>'+timing[0]+'</strong><p>'+timing[1]+'</p>':'';
  line.bindPopup('<b>'+venues[from][0]+' → '+venues[to][0]+'</b><br>'+timingInfo+ticketLink(duration)+linkLeg(from,to,duration)+googleSearch(to));
  const timeButton=document.createElement('button');
  timeButton.textContent=j+'구간 · '+duration;
  timeButton.setAttribute('aria-label',j+'구간 '+venues[from][0]+'에서 '+venues[to][0]+' '+duration+' 길찾기');
  if(timing){
   const badge=document.createElement('span');
   badge.className='timing-badge';
   badge.textContent='◷ 시간 확인';
   timeButton.append(badge);
   timeButton.setAttribute('aria-label',timeButton.getAttribute('aria-label')+' · '+timing[0]);
  }
  L.DomEvent.disableClickPropagation(timeButton);
  timeButton.onclick=e=>{e.stopPropagation();line.openPopup(chip.getLatLng());};
  const chip=L.tooltip({permanent:true,direction:'center',interactive:true,className:'leg-time'}).setContent(timeButton).setLatLng(endpoints[1]).addTo(overlays);
  const leader=L.polyline([],{color:'#315c51',weight:1.5,interactive:false}).addTo(overlays);
  legs.push({line,chip,leader});
  refreshLegChips();
  const profile=duration.startsWith('택시')?'car':duration.startsWith('도보 ')&&!duration.includes('MTR')?'foot':null;
  if(!profile)continue;
  const url='https://routing.openstreetmap.de/routed-'+profile+'/route/v1/driving/'+endpoints.map(([lat,lon])=>lon+','+lat).join(';')+'?overview=full&geometries=geojson';
  if(!roadCache.has(url))roadCache.set(url,fetch(url).then(r=>r.json()).then(data=>data.routes[0].geometry.coordinates.map(([lon,lat])=>[lat,lon])).catch(()=>{roadCache.delete(url);return null}));
  roadCache.get(url).then(path=>{if(path&&version===drawVersion){line.setLatLngs(path);flow.setLatLngs(path);line.setStyle({dashArray:null});refreshLegChips();}});
 }

 const markers=new Map();
 ids.forEach((id,j)=>{
  const [symbol,category]=placeType(id);
  const marker=L.marker(coord(id),{title:category+' · '+venues[id][0],alt:category+' · '+venues[id][0],
   icon:L.divIcon({className:'venue-pin',html:'<span aria-hidden="true">'+symbol+'</span><b class="visit-num">'+visits(stops,id)+'</b>',iconSize:[44,44],iconAnchor:[22,22],popupAnchor:[0,-12]})}).addTo(overlays);
  const visitsHere=stops.flatMap(([place,time],i)=>place===id?[(i+1)+'번 · '+time]:[]);
  const tickets=new Set();
  stops.slice(1).forEach(([to,,time],i)=>{
   const from=stops[i][0];
   if(from!==id && to!==id)return;
   tickets.add(ticketLink(time,true));
  });
  const mapLink='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(venues[id][3]+' Hong Kong');
  marker.bindPopup('<strong>'+symbol+' '+venues[id][0]+'</strong><small>예상 일정 · 홍콩 현지 시각</small><b>'+visitsHere.join('<br>')+'</b>'+[...tickets].join('')+
   '<div class="place-links"><a target="_blank" rel="noopener" href="'+mapLink+'">📍 지도</a>'+googleSearch(id)+'</div>',
   {className:'place-popup',maxWidth:350});markers.set(id,marker);
 });
 return id=>{if(id){streets.setView(coord(id),17);markers.get(id).openPopup();}else{streets.closePopup();streets.fitBounds(box,{padding:[35,35],maxZoom:17});}};
}
function render(i){
 document.querySelector("#route-choice").value=String(i);
 const [tab,title,summary,stops]=routes[i];document.querySelector('#day').textContent=title;document.querySelector('#summary').textContent=summary+' 시각은 홍콩 현지 기준 예상 일정입니다.';map.replaceChildren();list.replaceChildren();
 [...tabs.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
 const ids=[...new Set(stops.map(s=>s[0]))],xs=ids.map(id=>venues[id][2]),ys=ids.map(id=>venues[id][1]);
 const select=document.querySelector('#spot');
 select.replaceChildren(new Option('구간 전체',''),...ids.map(id=>new Option(placeType(id)[0]+' '+venues[id][0],id)));
 const focusMap=routeLayer(stops,ids);
 function showStreetMap(id){
  focusMap(id);
  const target=id||ids[0];
  document.querySelector('#largemap').href='https://www.openstreetmap.org/?mlat='+venues[target][1]+'&mlon='+venues[target][2]+'#map=16/'+venues[target][1]+'/'+venues[target][2];
 }
 select.onchange=()=>showStreetMap(select.value);showStreetMap('');
 const x0=Math.min(...xs),y1=Math.max(...ys),scale=Math.min(220/(Math.max(...xs)-x0),285/(y1-Math.min(...ys))*0.93);
 const pos=id=>[25+(venues[id][2]-x0)*scale,26+(y1-venues[id][1])*scale/0.93];
 stops.slice(1).forEach((s,j)=>{const [x,y]=pos(stops[j][0]),[u,v]=pos(s[0]);mark('line',{x1:x,y1:y,x2:u,y2:v,stroke:'#4b8077','stroke-width':2})});
 // Spread numbered labels into separate rows even where nearby points coincide at city scale.
 const sorted=ids.slice().sort((a,b)=>pos(a)[1]-pos(b)[1]);
 sorted.forEach((id,j)=>{const [x,y]=pos(id),row=23+j*(302/Math.max(1,sorted.length-1)),number=visits(stops,id),color=venues[id][4]?'#a14820':'#205951';
 mark('polyline',{points:x+','+y+' 258,'+row+' 272,'+row,fill:'none',stroke:'#8c9e94','stroke-width':1});mark('circle',{cx:x,cy:y,r:4,fill:color});mark('text',{x:276,y:row+5,fill:color,'font-size':15,'font-weight':650},number+' '+venues[id][0]);});
 // Give each unique leg a time label anchored to the midpoint of its line.
 const used=[],seen=new Set();
 stops.slice(1).forEach(([id,,duration],j)=>{const from=stops[j][0],key=[id,from].sort().join('|');if(seen.has(key))return;seen.add(key);
 const [x,y]=pos(id),[u,v]=pos(from),mx=(x+u)/2,my=(y+v)/2;
 const tx=Math.max(60,Math.min(202,mx));let ty=Math.max(13,Math.min(325,my));
 for(let delta=0;delta<350;delta+=17){const choice=[ty-delta,ty+delta].find(n=>n>10&&n<334&&used.every(r=>Math.abs(n-r)>16));if(choice!==undefined){ty=choice;break;}}
 used.push(ty);mark('line',{x1:mx,y1:my,x2:tx,y2:ty,stroke:'#457568'});mark('rect',{x:tx-56,y:ty-8,width:112,height:16,rx:4,fill:'#174f46'});mark('text',{x:tx,y:ty+4,'text-anchor':'middle',fill:'white','font-size':11},(j+1)+' · '+duration);});
 stops.forEach(([id,time,duration,note],j)=>{const [name,,,address,price,status,source]=venues[id],a=document.createElement('article');
 const link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address+' Hong Kong');
 a.innerHTML=(duration?'<small>'+j+'구간 · '+venues[stops[j-1][0]][0]+'에서 '+duration+'</small>':'')+'<h3><span class="num">'+(j+1)+'</span>　'+time+' · '+placeType(id)[0]+' '+name+'</h3>'+(price?'<p><b>'+price+'</b><br>'+status+'</p>':'')+(note?'<p>'+note+'</p>':'')+'<a href="'+link+'">📍 지도</a>　'+googleSearch(id)+(source?'　<a href="'+source+'">ℹ️ 매장 정보</a>':'');if(j){const timing=timingNotes[stops[j-1][0]+':'+id];if(timing){const note=document.createElement('p');note.textContent=timing[1];a.append(note);}a.insertAdjacentHTML('beforeend',ticketLink(duration));const go=document.createElement('a');go.textContent='🧭 길찾기';go.href='https://www.google.com/maps/dir/?'+new URLSearchParams({api:'1',origin:venues[stops[j-1][0]][3]+' Hong Kong',destination:address+' Hong Kong',travelmode:duration.startsWith('택시')?'driving':duration.startsWith('도보 ')&&!duration.includes('MTR')?'walking':'transit'});a.append(go);}const locate=document.createElement('button');locate.textContent='이곳 지도 보기';locate.style.marginLeft='8px';locate.onclick=()=>{openDetails(false);select.value=id;showStreetMap(id);};a.append(locate);list.append(a)});
}
const routeChoice=document.querySelector('#route-choice');
routeChoice.onchange=()=>{openDetails(false);sheet.scrollTop=0;render(Number(routeChoice.value));};
routes.forEach((r,i)=>{routeChoice.add(new Option(r[0],String(i)));const b=document.createElement('button');b.textContent=r[0];b.onclick=()=>render(i);tabs.append(b)});
const viewKey='hong-kong-family-guide:view:1';
function rememberView(){
 try{
  const center=streets?.getCenter();
  sessionStorage.setItem(viewKey,JSON.stringify({route:routeChoice.value,spot:document.querySelector('#spot').value,open:!sheet.hidden,scroll:sheet.scrollTop,center:center&&[center.lat,center.lng],zoom:streets?.getZoom()}));
 }catch{}
}
let saved;
try{saved=JSON.parse(sessionStorage.getItem(viewKey));}catch{}
const initial=Number(saved?.route);
render(Number.isInteger(initial)&&routes[initial]?initial:1);
if(saved){
 const spot=document.querySelector('#spot');
 if(saved.spot&&[...spot.options].some(o=>o.value===saved.spot)){spot.value=saved.spot;spot.onchange();}
 openDetails(saved.open===true);
 if(streets&&Array.isArray(saved.center)&&saved.center.length===2&&saved.center.every(Number.isFinite)&&Number.isFinite(saved.zoom))streets.setView(saved.center,saved.zoom,{animate:false});
 sheet.scrollTop=saved.scroll||0;
}
window.addEventListener('pagehide',rememberView);
document.addEventListener('visibilitychange',()=>{if(document.hidden)rememberView()});
</script></html>
